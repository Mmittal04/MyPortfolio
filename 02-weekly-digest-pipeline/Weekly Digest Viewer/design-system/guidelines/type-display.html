<!-- @dsCard group="Type" viewport="700x200" name="Literata — display & titles" subtitle="Reading serif at 48 / 30 / 20px" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="font-family:var(--font-serif)">
<div style="font:var(--type-display);color:var(--text-primary);letter-spacing:var(--tracking-tight)">This week in Finance</div>
<div class="mono">--type-display · 48/1.15 · 600</div>
<div style="font:var(--type-title);color:var(--text-primary);margin-top:14px">Central banks hold rates steady</div>
<div class="mono">--type-title · 30/1.3 · 600</div>
<div style="font:var(--type-headline);color:var(--text-primary);margin-top:14px">Bond markets price a slower easing cycle</div>
<div class="mono">--type-headline · 20/1.3 · 600</div></div></body></html>
