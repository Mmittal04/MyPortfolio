<!-- @dsCard group="Colors" viewport="700x180" name="Teal & Indigo (split complements)" subtitle="Secondary accents — Finance and Technology" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div class="grid">
<div><div class="name" style="margin-bottom:6px">Teal — --accent-secondary</div><div class="sw"><div style="background:var(--teal-100);color:var(--sand-900)">100</div><div style="background:var(--teal-300);color:var(--sand-900)">300</div><div style="background:var(--teal-500);color:#fff">500</div><div style="background:var(--teal-600);color:#fff">600</div><div style="background:var(--teal-700);color:#fff">700</div></div></div>
<div><div class="name" style="margin-bottom:6px">Indigo — --accent-tertiary</div><div class="sw"><div style="background:var(--indigo-100);color:var(--sand-900)">100</div><div style="background:var(--indigo-300);color:var(--sand-900)">300</div><div style="background:var(--indigo-500);color:#fff">500</div><div style="background:var(--indigo-600);color:#fff">600</div><div style="background:var(--indigo-700);color:#fff">700</div></div></div>
</div></body></html>
