name: Daily Digest

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC daily
  workflow_dispatch: {}     # allows manual triggering from the Actions tab

permissions:
  contents: write

defaults:
  run:
    # All run: steps execute inside this subfolder, since the pipeline
    # lives at 02-daily-digest-pipeline/ within the MyPortfolio monorepo,
    # not at the repo root.
    working-directory: 02-daily-digest-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py

      - name: Commit and push digest + database
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digests/ data/digest.db
          if ! git diff --quiet --cached; then
            git commit -m "Daily digest $(date -u +%F)"
            # main is a monorepo shared with manual pushes, so rebase onto
            # whatever's there now before pushing -- a plain push fails
            # non-fast-forward if anything landed on main since checkout.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
