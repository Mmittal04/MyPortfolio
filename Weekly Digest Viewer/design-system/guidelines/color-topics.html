<!-- @dsCard group="Colors" viewport="700x140" name="Topic accents" subtitle="One hue per digest topic, used on tabs, card edges and tags" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;background:var(--topic-technology-soft);border-left:3px solid var(--topic-technology);border-radius:var(--radius-sm);padding:14px">
<div style="font-size:13px;font-weight:600;color:var(--sand-900)">Technology</div>
<div class="mono" style="margin-top:6px">--topic-technology</div></div><div style="flex:1;background:var(--topic-finance-soft);border-left:3px solid var(--topic-finance);border-radius:var(--radius-sm);padding:14px">
<div style="font-size:13px;font-weight:600;color:var(--sand-900)">Finance</div>
<div class="mono" style="margin-top:6px">--topic-finance</div></div><div style="flex:1;background:var(--topic-politics-soft);border-left:3px solid var(--topic-politics);border-radius:var(--radius-sm);padding:14px">
<div style="font-size:13px;font-weight:600;color:var(--sand-900)">Politics</div>
<div class="mono" style="margin-top:6px">--topic-politics</div></div></div></body></html>
