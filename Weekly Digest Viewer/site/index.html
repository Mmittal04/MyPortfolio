<!doctype html><html><head><meta charset="utf-8"><title>Maan's Weekly Digest</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="_ds_bundle.js"></script>
<style>body{margin:0}</style></head>
<body><div id="root"></div>
<!--
  Native ES module, deliberately NOT run through Babel: the in-browser
  Babel transformer rewrites `import()` into a CommonJS `require()` call
  when it appears inside a text/babel script, which doesn't exist in the
  browser ("require is not defined"). Bridging digest-data.js's exports
  onto a window global here sidesteps that -- DigestApp.jsx (Babel-
  transpiled below) just waits for window.__digestData to appear.
-->
<script type="module">
  import { TOPICS, loadAllDigests } from './digest-data.js';
  window.__digestData = { TOPICS, loadAllDigests };
</script>
<script type="text/babel" src="DigestPanel.jsx"></script>
<script type="text/babel" src="DigestApp.jsx"></script>
<script type="text/babel" data-presets="react">
ReactDOM.createRoot(document.getElementById('root')).render(<DigestApp/>);
</script>
</body></html>
