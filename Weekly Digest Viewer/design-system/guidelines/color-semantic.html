<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & signal" subtitle="Text, surfaces, borders and the two signal colours" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--text-primary);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Text primary</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--text-secondary);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Text secondary</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--text-muted);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Text muted</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--text-link);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Link</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--surface-page);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Surface page</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--surface-card);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Surface card</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--surface-sunken);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Surface sunken</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--border-subtle);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Border subtle</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--status-error-fg);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Error</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--status-notice-fg);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Notice</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--accent-secondary);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Success</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--focus-ring);border:1px solid var(--border-hairline);flex:0 0 auto"></span><span class="mono" style="font-size:10px">Focus ring</span></div></div></body></html>
