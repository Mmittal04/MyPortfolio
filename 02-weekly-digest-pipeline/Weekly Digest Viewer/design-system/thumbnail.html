<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}.wrap{display:flex;width:1280px;height:854px}
.main{flex:0 0 75%;background:var(--clay-600);display:flex;align-items:center;justify-content:center;padding:0 40px}
.mark{font-family:var(--font-serif);font-weight:600;font-size:96px;line-height:1.05;letter-spacing:-.02em;color:var(--sand-50);text-align:center}
.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="wrap"><div class="main"><div class="mark">Maan's Weekly Digest</div></div>
<div class="strip"><div style="background:var(--clay-300)"></div><div style="background:var(--teal-500)"></div><div style="background:var(--indigo-600)"></div><div style="background:var(--teal-700)"></div></div></div></body></html>
