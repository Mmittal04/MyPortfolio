<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="display:flex;gap:12px;flex-wrap:wrap">
<div style="text-align:center"><div style="padding:9px 16px;border-radius:var(--radius-sm);background:var(--clay-600);color:var(--text-inverse);font:var(--type-ui);font-size:14px;transform:none;box-shadow:none">Read source</div><div class="mono" style="margin-top:6px">Rest</div></div><div style="text-align:center"><div style="padding:9px 16px;border-radius:var(--radius-sm);background:var(--clay-700);color:var(--text-inverse);font:var(--type-ui);font-size:14px;transform:none;box-shadow:none">Read source</div><div class="mono" style="margin-top:6px">Hover</div></div><div style="text-align:center"><div style="padding:9px 16px;border-radius:var(--radius-sm);background:var(--clay-800);color:var(--text-inverse);font:var(--type-ui);font-size:14px;transform:translateY(1px);box-shadow:none">Read source</div><div class="mono" style="margin-top:6px">Press</div></div><div style="text-align:center"><div style="padding:9px 16px;border-radius:var(--radius-sm);background:var(--clay-600);color:var(--text-inverse);font:var(--type-ui);font-size:14px;transform:none;box-shadow:var(--ring-focus)">Read source</div><div class="mono" style="margin-top:6px">Focus</div></div></div>
<div class="mono" style="margin-top:12px">Cards: hover raises shadow and lifts 1px. Tabs: colour + 2px inset underline. Never scale, never bounce.</div></body></html>
