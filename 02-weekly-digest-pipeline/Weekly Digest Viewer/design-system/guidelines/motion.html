<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px"><div style="font-size:18px;font-family:var(--font-serif);color:var(--text-primary)">120ms</div><div class="mono" style="margin-top:4px">--duration-fast</div><div class="mono">hover colour</div></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px"><div style="font-size:18px;font-family:var(--font-serif);color:var(--text-primary)">180ms</div><div class="mono" style="margin-top:4px">--duration-base</div><div class="mono">card lift</div></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px"><div style="font-size:18px;font-family:var(--font-serif);color:var(--text-primary)">260ms</div><div class="mono" style="margin-top:4px">--duration-slow</div><div class="mono">panel fade</div></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px"><div style="font-size:18px;font-family:var(--font-serif);color:var(--text-primary)">400ms</div><div class="mono" style="margin-top:4px">--duration-page</div><div class="mono">tab crossfade</div></div></div>
<div class="mono" style="margin-top:10px">--ease-out cubic-bezier(.2,.8,.3,1) for entrances · --ease-in-out for loops</div></body></html>
