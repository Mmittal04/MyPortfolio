# One entry per topic. Adding a new topic later means adding an entry here,
# not touching the pipeline code.
#
# active:   whether main.py should process this topic on a given run
# feeds:    RSS/Atom feed URLs to poll
# keywords: optional lowercase substrings; if non-empty, an entry is only kept
#           when the title+summary contains at least one of them (leave empty
#           to keep everything from the feed)

topics:
  - slug: technology
    name: "Technology"
    active: true
    feeds:
      - https://techcrunch.com/feed/
      - https://www.theverge.com/rss/index.xml
      - https://feeds.arstechnica.com/arstechnica/index
      - https://www.wired.com/feed/category/business/latest/rss
      - https://entrackr.com/rss
      - https://inc42.com/feed/
      # Additional Indian-tech sources checked (23-08-26): Analytics India
      # Magazine (analyticsindiamag.com/feed) and MediaNama (medianama.com/feed)
      # both returned empty/broken from here; Digit.in (digit.in/feed) works
      # but its all-categories feed mixes Hindi and English and skews toward
      # product-discount posts rather than editorial coverage, not added.
      #
      # Dropped after reviewing real sample output (23-08-26):
      # - hnrss.org/frontpage: mixed off-topic personal essays/culture pieces
      #   in with the tech content, and hnrss's description field never
      #   carries real article text, so keyword filtering can't reach it.
      # - behavioralscientist.org: not technology (behavioral science essays).
      # - yourstory.com: PR/event-announcement flavoured, plus a bloated
      #   full-HTML feed. Replaced with entrackr.com/rss for Indian startup
      #   coverage instead, real funding/DRHP/financial reporting.
      # - bloomberg.com/feeds/technology/news.rss: feed appears discontinued;
      #   no working public RSS endpoint found for Bloomberg Technology.
      # - uktech.news/feed: legitimate site with real content, but no
      #   working feed URL found after trying the common WordPress paths.
    keywords:
      - startups
      - ai
      - consumers
      - product
      - users
      - technology
      - research
      - data

  - slug: finance
    name: "Finance"
    active: true
    feeds:
      - https://feeds.bbci.co.uk/news/business/rss.xml
      - https://www.business-standard.com/rss/markets-106.rss
      - https://www.business-standard.com/rss/economy-policy-102.rss
      - https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms
      # Re-verified all of the above (25-08-26) properly through feedparser
      # itself (not just curl) with a browser User-Agent -- see the
      # ingest.py REQUEST_HEADERS fix in the same change: feedparser's
      # default UA gets a flat 403/zero-entries from business-standard.com,
      # silently, with no exception raised. All four return real entries
      # (35-51 each) with the fix in place.
      #
      # FT dropped (25-08-26): the URL previously here
      # (ft.com/myft/following/<id>?format=rss) 302-redirects to
      # accounts.ft.com/login -- it's a personal "MyFT following" page tied
      # to someone's FT account, not a public feed, and was never going to
      # work unauthenticated. No public FT RSS endpoint found to replace it
      # with; Economic Times Markets (added above) covers some of the same
      # ground for India specifically.
      #
      # Checked and dropped (24-08-26):
      # - feeds.content.dowjones.io/public/rss/mw_topstories (MarketWatch):
      #   verified working, but content skews toward US personal-finance
      #   advice columns rather than markets/companies news. Dropped per
      #   review, may revisit later for the "Personal Finance" keyword
      #   specifically.
      # - CNBC (cnbc.com/id/10001147/device/rss/rss.html): endpoint dead,
      #   returns nothing.
      # - Yahoo Finance RSS: discontinued, endpoint returns nothing.
      # - Nikkei Asia RSS: endpoint returns nothing, likely discontinued.
      # - Reuters: no working public RSS found (Reuters discontinued most
      #   public feeds some years back).
    keywords:
      - india
      - us
      - uk
      - asia
      - companies
      - markets
      - personal finance
      - stocks
      - climate
      - energy

  - slug: politics
    name: "Politics"
    active: true
    feeds:
      - https://feeds.bbci.co.uk/news/world/rss.xml
      - https://www.aljazeera.com/xml/rss/all.xml
      - https://www.hrw.org/rss/news
      - https://www.theguardian.com/world/rss
      - https://www.thehindu.com/news/national/feeder/default.rss
      # BBC World, Al Jazeera and Guardian World are broad wire feeds mixed
      # with sport/lifestyle/opinion content; keyword filtering below is
      # doing more work here than it did for Technology. Human Rights Watch
      # is an advocacy organisation, not wire journalism -- included
      # deliberately for direct coverage of migration, democracy, and
      # women's/LGBTQ+ rights, but it's not a neutral source in the way the
      # wire feeds are meant to be; worth keeping in mind when reading its
      # entries in the digest. The Hindu's National feed is the dedicated
      # India-politics source the keyword list needed (25-08-26) -- the
      # earlier gap noted below is now closed; Hindustan Times covers the
      # same ground and could be added too if The Hindu alone proves thin.
      #
      # Guardian/Hindu were previously listed as blocked from this
      # project's fetch tooling and unverified; re-checked (25-08-26)
      # directly through feedparser with a browser User-Agent (see the
      # ingest.py REQUEST_HEADERS fix in the same change) and both return
      # real entries (45 and 60 respectively).
      #
      # Checked and dropped (24-08-26):
      # - npr.org/rss/rss.php?id=1004: endpoint returns nothing, likely
      #   discontinued.
    keywords:
      - migration
      - democracy
      - us
      - uk
      - india
      - lgbtq+ rights
      - women's rights
      - youth
      - unemployment
      - economy
      - wars & conflicts
      - climate
      - energy

# Gender-affirming care/transgender rights removed for now, to be rebuilt
# with a proper feed-list review later. Energy & Climate was considered as
# its own topic (24-08-26) but folded into the Finance and Politics keyword
# lists instead, rather than standing up a fourth topic with its own
# (currently weak -- Mongabay India came back stale, Down To Earth empty)
# feed list.
