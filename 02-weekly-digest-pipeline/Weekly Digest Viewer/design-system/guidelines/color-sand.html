<!-- @dsCard group="Colors" viewport="700x120" name="Sand (neutrals)" subtitle="Warm neutrals — every surface, border and text colour" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div class="sw"><div style="background:var(--sand-50);color:var(--sand-900)">50</div><div style="background:var(--sand-100);color:var(--sand-900)">100</div><div style="background:var(--sand-200);color:var(--sand-900)">200</div><div style="background:var(--sand-300);color:var(--sand-900)">300</div><div style="background:var(--sand-400);color:var(--sand-900)">400</div><div style="background:var(--sand-500);color:#fff">500</div><div style="background:var(--sand-600);color:#fff">600</div><div style="background:var(--sand-700);color:#fff">700</div><div style="background:var(--sand-800);color:#fff">800</div><div style="background:var(--sand-900);color:#fff">900</div></div></body></html>
