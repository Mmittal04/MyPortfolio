<!-- @dsCard group="Spacing" viewport="700x140" name="Elevation" subtitle="Hairline → card → raised → overlay" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-hairline)}
.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.name{font-size:11px;font-weight:600;color:var(--text-secondary)}
</style></head><body><div style="display:flex;gap:16px">
<div style="text-align:center"><div style="width:130px;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-hairline)"></div><div class="mono" style="margin-top:8px">--shadow-hairline</div></div><div style="text-align:center"><div style="width:130px;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card)"></div><div class="mono" style="margin-top:8px">--shadow-card</div></div><div style="text-align:center"><div style="width:130px;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-raised)"></div><div class="mono" style="margin-top:8px">--shadow-raised</div></div><div style="text-align:center"><div style="width:130px;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-overlay)"></div><div class="mono" style="margin-top:8px">--shadow-overlay</div></div></div></body></html>
